name: Build public chapter PDFs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_public_pdfs.py'
      - 'content.js'
      - '.github/workflows/build-public-pdfs.yml'
permissions:
  contents: write
jobs:
  build-pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install PDF rendering dependencies and Hindi fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core
          python -m pip install --user weasyprint
      - name: Generate 14 PDFs
        run: python scripts/build_public_pdfs.py
      - name: Commit PDFs to GitHub Pages source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdf/*.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Generate 14 public chapter PDFs [skip ci]"
            git push
          fi
